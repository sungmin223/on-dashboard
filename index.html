<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영업ON본부 AI 업무혁신 통합 대시보드</title>
<style>
  /* =========================================================
     영업ON본부 AI 업무혁신 통합 대시보드 — UI 골격 (Design Skeleton)
     ---------------------------------------------------------
     기준 문서: dashboard_spec.md / data_schema.md /
                validation_rules.md / empty_data_template
     ⚠ 현재 단계: 디자인 기반 UI 골격 + 기준 문서 정합화
     - 실제 데이터/계산식/API 연동 미포함 (빈 상태 운영 구조)
     - 모든 표 컬럼명은 data_schema.md(=CSV 헤더)와 1:1 일치
     - 빈 값은 표준 5종 문구로만 표시(가짜데이터 생성 금지)
     ========================================================= */

  :root {
    --bg:            #0f1115;
    --surface:       #171a21;
    --surface-2:     #1d212b;
    --surface-3:     #232834;
    --border:        #2b313d;
    --border-soft:   #232834;

    --text:          #e8eaf0;
    --text-2:        #aeb4c2;
    --text-3:        #757d8f;

    --accent:        #5b8cff;
    --accent-soft:   rgba(91,140,255,0.12);
    --wine:          #b13a52;
    --wine-soft:     rgba(177,58,82,0.14);

    --ok:            #36b37e;
    --warn:          #e2b93b;
    --danger:        #e25c5c;
    --neutral:       #6b7280;

    --radius:        14px;
    --radius-sm:     9px;
    --shadow:        0 1px 2px rgba(0,0,0,0.4), 0 8px 24px rgba(0,0,0,0.25);
    --font:          "Pretendard","Malgun Gothic","Apple SD Gothic Neo",system-ui,-apple-system,"Segoe UI",sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .app { max-width: 1320px; margin: 0 auto; padding: 28px 28px 64px; }

  /* ---------- Header ---------- */
  .topbar {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 20px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .brand { display: flex; gap: 14px; align-items: center; }
  .brand-mark {
    width: 46px; height: 46px; border-radius: 12px; flex: none;
    background: linear-gradient(135deg, var(--accent), var(--wine));
    display: grid; place-items: center; font-weight: 800; font-size: 18px; color: #fff;
    box-shadow: var(--shadow);
  }
  .brand h1 { font-size: 21px; margin: 0; letter-spacing: -0.3px; font-weight: 700; }
  .brand .sub { color: var(--text-2); font-size: 13px; margin-top: 3px; }

  .topbar-actions { display: flex; gap: 8px; align-items: center; }

  .btn {
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600;
    cursor: pointer; display: inline-flex; gap: 7px; align-items: center; font-family: inherit;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--surface-3); border-color: #39414f; }
  .btn-sm { padding: 5px 11px; font-size: 12px; }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn-primary:hover { background: #4f7ef0; border-color: #4f7ef0; }

  /* ---------- Trust banner (데이터 신뢰도 배너) ---------- */
  .trust-banner {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    border: 1px solid rgba(226,92,92,0.35); border-left: 4px solid var(--danger);
    background: linear-gradient(90deg, rgba(226,92,92,0.10), rgba(226,92,92,0.02));
    border-radius: var(--radius); padding: 13px 18px; margin-bottom: 12px;
  }
  .trust-banner .tb-state { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 14px; }
  .trust-banner .tb-msg { color: var(--text-2); font-size: 13px; }
  .trust-banner .tb-spacer { flex: 1 1 auto; }
  .trust-banner .tb-notice { color: var(--text-3); font-size: 12px; }
  .trust-banner--partial {
    border-color: rgba(226,185,59,0.4); border-left-color: var(--warn);
    background: linear-gradient(90deg, rgba(226,185,59,0.10), rgba(226,185,59,0.02));
  }

  /* ---------- Status strip ---------- */
  .statusbar {
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 12px 18px; margin-bottom: 22px;
  }
  .statusbar .item { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--text-2); }
  .statusbar .item b { color: var(--text); font-weight: 600; }
  .statusbar .divider { width: 1px; height: 18px; background: var(--border); }

  /* ---------- Badges ---------- */
  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 600;
    border: 1px solid transparent; white-space: nowrap;
  }
  .badge .dot { width: 7px; height: 7px; border-radius: 50%; }
  .badge-warn    { background: rgba(226,185,59,0.12);  color: #e7c869; border-color: rgba(226,185,59,0.3); }
  .badge-warn .dot    { background: var(--warn); }
  .badge-danger  { background: rgba(226,92,92,0.12);   color: #f08a8a; border-color: rgba(226,92,92,0.3); }
  .badge-danger .dot  { background: var(--danger); }
  .badge-ok      { background: rgba(54,179,126,0.12);  color: #5fd6a3; border-color: rgba(54,179,126,0.3); }
  .badge-ok .dot      { background: var(--ok); }
  .badge-neutral { background: var(--surface-3);       color: var(--text-2); border-color: var(--border); }
  .badge-neutral .dot { background: var(--neutral); }

  /* ---------- Section ---------- */
  .section { margin-bottom: 22px; }
  .section-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 12px;
  }
  .section-head .title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .section-head h2 { font-size: 15px; margin: 0; font-weight: 700; letter-spacing: -0.2px; }
  .section-head .num {
    width: 22px; height: 22px; border-radius: 6px; flex: none;
    background: var(--accent-soft); color: var(--accent);
    display: grid; place-items: center; font-size: 12px; font-weight: 700;
  }
  .section-head .hint { color: var(--text-3); font-size: 12px; }
  .section-head .sheet {
    font-size: 11px; color: var(--text-3); font-family: ui-monospace, "Consolas", monospace;
    background: var(--surface-2); border: 1px solid var(--border); padding: 1px 7px; border-radius: 5px;
  }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .card-pad { padding: 18px; }

  .grid { display: grid; gap: 14px; }
  .grid-4 { grid-template-columns: repeat(4, 1fr); }
  .grid-3 { grid-template-columns: repeat(3, 1fr); }
  .grid-2 { grid-template-columns: repeat(2, 1fr); }
  @media (max-width: 1040px) { .grid-4 { grid-template-columns: repeat(2,1fr); } .grid-3 { grid-template-columns: repeat(2,1fr);} }
  @media (max-width: 680px)  { .grid-4, .grid-3, .grid-2 { grid-template-columns: 1fr; } }

  /* ---------- KPI Card ---------- */
  .kpi { padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; min-height: 122px; }
  .kpi .kpi-top { display: flex; align-items: center; justify-content: space-between; }
  .kpi .kpi-label { color: var(--text-2); font-size: 13px; font-weight: 600; }
  .kpi .kpi-icon {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center;
    background: var(--accent-soft); color: var(--accent); font-size: 15px;
  }
  .kpi .kpi-value { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; color: var(--text-3); }
  .kpi .kpi-foot { font-size: 12px; color: var(--text-3); display: flex; align-items: center; gap: 8px; }
  .kpi .kpi-src { font-family: ui-monospace,"Consolas",monospace; font-size: 10.5px; color: var(--text-3); opacity: .8; }

  /* ---------- Empty State ---------- */
  .empty {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; gap: 10px; color: var(--text-3);
    border: 1px dashed var(--border); border-radius: var(--radius-sm);
    background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.012) 10px, rgba(255,255,255,0.012) 20px);
    padding: 26px 18px;
  }
  .empty.lg { min-height: 220px; }
  .empty.md { min-height: 150px; }
  .empty.sm { min-height: 96px; padding: 18px; }
  .empty .e-icon {
    width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center;
    background: var(--surface-3); color: var(--text-2); font-size: 18px; border: 1px solid var(--border);
  }
  .empty .e-msg { font-size: 13px; font-weight: 600; color: var(--text-2); }
  .empty .e-sub { font-size: 12px; color: var(--text-3); max-width: 420px; }

  /* ---------- Tabs ---------- */
  .tabs { display: flex; gap: 4px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 4px; flex-wrap: wrap; }
  .tab {
    border: 0; background: transparent; color: var(--text-2); font-family: inherit;
    padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; cursor: pointer;
    transition: background .15s, color .15s;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,0.3); }

  /* ---------- Table ---------- */
  .table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; min-width: max-content; }
  table.tbl th {
    text-align: left; color: var(--text-2); font-weight: 600; font-size: 12px;
    padding: 11px 14px; border-bottom: 1px solid var(--border); white-space: nowrap;
    background: var(--surface-2);
  }
  table.tbl th .req { color: var(--danger); font-size: 10px; margin-left: 2px; vertical-align: top; }
  table.tbl th .auto { color: var(--text-3); font-size: 10px; font-weight: 500; margin-left: 3px; opacity: .8; }
  table.tbl td { padding: 13px 14px; border-bottom: 1px solid var(--border-soft); color: var(--text-2); }
  .tbl-empty-row td { text-align: center; padding: 30px 14px; color: var(--text-3); }

  /* ---------- Two-column ---------- */
  .split { display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px; }
  @media (max-width: 980px) { .split { grid-template-columns: 1fr; } }

  .note { font-size: 12px; color: var(--text-3); margin-top: 10px; line-height: 1.6; }
  .note b { color: var(--text-2); font-weight: 600; }

  /* ---------- Summary ---------- */
  .summary-list { display: flex; flex-direction: column; gap: 10px; }
  .summary-item {
    display: flex; gap: 12px; align-items: flex-start; padding: 14px;
    background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  }
  .summary-item .s-num {
    width: 24px; height: 24px; flex: none; border-radius: 7px; display: grid; place-items: center;
    background: var(--wine-soft); color: #d98a9c; font-weight: 700; font-size: 12px;
  }
  .summary-item .s-body .s-title { font-weight: 600; color: var(--text); font-size: 13.5px; }
  .summary-item .s-body .s-val { color: var(--text-3); font-size: 12.5px; margin-top: 4px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .summary-item .s-body .s-src { font-family: ui-monospace,"Consolas",monospace; font-size: 10.5px; color: var(--text-3); opacity: .8; }

  /* ---------- Connection ---------- */
  .conn-row {
    display: flex; align-items: center; justify-content: space-between; gap: 14px;
    padding: 14px 4px; border-bottom: 1px solid var(--border-soft);
  }
  .conn-row:last-child { border-bottom: 0; }
  .conn-row .c-left { display: flex; gap: 12px; align-items: center; }
  .conn-row .c-ic {
    width: 34px; height: 34px; border-radius: 9px; flex: none; display: grid; place-items: center;
    background: var(--surface-3); color: var(--text-2); font-size: 16px; border: 1px solid var(--border);
  }
  .conn-row .c-name { font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; }
  .conn-row .c-sheet { font-family: ui-monospace,"Consolas",monospace; font-size: 11px; color: var(--text-3); }
  .conn-row .c-desc { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .conn-row .c-right { display: flex; gap: 8px; align-items: center; }

  .legend { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border-soft); }
  .legend .lg-item { display: flex; gap: 7px; align-items: center; font-size: 12px; color: var(--text-3); }

  .progress-skeleton { height: 10px; border-radius: 999px; background: var(--surface-3); overflow: hidden; border: 1px solid var(--border); }

  .footnote { color: var(--text-3); font-size: 12px; margin-top: 26px; text-align: center; line-height: 1.7; }

  /* ---------- 인쇄 / PDF 저장 (대표님 보고용) ---------- */
  @media print {
    :root {
      --bg:#ffffff; --surface:#ffffff; --surface-2:#f4f6f9; --surface-3:#eceff4;
      --border:#cfd5df; --border-soft:#e3e7ee;
      --text:#161a21; --text-2:#39404e; --text-3:#6b7280; --shadow:none;
    }
    body { background:#fff; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .app { max-width:none; padding:0 4mm; }
    .no-print { display:none !important; }
    .card, .statusbar { box-shadow:none !important; }
    .card-pad { padding:12px 14px; }
    .section { margin-bottom:14px; }
    table.tbl { font-size:10.5px; }
    table.tbl th, table.tbl td { padding:6px 8px; }
    thead { display: table-header-group; }   /* 페이지 넘김 시 머리글 반복 */
    tr, .summary-item, .conn-row { break-inside: avoid; }
    .table-wrap { overflow: visible !important; border-color: var(--border); }
    h1 { font-size:18px; }
    @page { size: A4; margin: 12mm; }
  }

  /* ---------- 접근 잠금 (간단 비밀번호) ---------- */
  #gate { position: fixed; inset: 0; z-index: 9999; background: var(--bg);
    display: flex; align-items: center; justify-content: center; padding: 20px; }
  #gate .gbox { width: 330px; max-width: 92vw; background: var(--surface);
    border: 1px solid var(--border); border-radius: 16px; padding: 30px 26px;
    box-shadow: var(--shadow); text-align: center; }
  #gate .glogo { width: 48px; height: 48px; border-radius: 13px; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--accent), var(--wine)); display: grid;
    place-items: center; color: #fff; font-weight: 800; font-size: 18px; }
  #gate h2 { font-size: 16px; margin: 0 0 5px; font-weight: 700; }
  #gate .gsub { color: var(--text-3); font-size: 12.5px; margin: 0 0 18px; }
  #gate input { width: 100%; padding: 12px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
    font-size: 14px; box-sizing: border-box; outline: none; }
  #gate input:focus { border-color: var(--accent); }
  #gate button { width: 100%; margin-top: 11px; padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer;
    font-family: inherit; }
  #gate button:hover { background: #4f7ef0; }
  #gate .gerr { color: var(--danger); font-size: 12px; min-height: 17px; margin-top: 9px; }
  #gate .gnote { color: var(--text-3); font-size: 11px; margin-top: 14px; line-height: 1.5; }
  @media print { #gate { display: none !important; } }
</style>
</head>
<body>
<div id="gate">
  <div class="gbox">
    <div class="glogo">ON</div>
    <h2>영업ON본부 통합 대시보드</h2>
    <div class="gsub">접근 비밀번호를 입력하세요</div>
    <input id="gate-pw" type="password" placeholder="비밀번호" autocomplete="off" autofocus />
    <button id="gate-go" type="button">확인</button>
    <div class="gerr" id="gate-err"></div>
    <div class="gnote">영업ON본부 내부 보고용 · 무단 외부 공유 금지</div>
  </div>
</div>
<div class="app" id="app"><!-- JS가 렌더링 --></div>

<script>
/* =========================================================
   기준 문서 상수 (data_schema.md / validation_rules.md)
   ========================================================= */

/* 빈 상태 표준 문구 — validation_rules §2 (E1~E5). 이 외 문구 사용 금지 */
const EMPTY = {
  noFile:    "자료 미첨부",            // E1: 원천 자료 자체 없음
  needData:  "데이터 연결 필요",       // E2: 내부 CSV/Excel/JSON 시트 미연결
  needApi:   "API 연결 필요",          // E3: 외부 API/시스템 연동 미완
  noDetail:  "상세 데이터 미첨부",     // E4: 요약은 있으나 드릴다운 원본 없음
  afterLink: "자료 연결 후 확인 가능", // E5: 클릭 가능한 카드·표 항목에 연결할 상세 자료가 아직 없을 때
};

/* 문서가 직접 규정한 상태 문구 (dashboard_spec §3 / data_schema S5) */
const MSG = {
  targetEmpty: "목표 데이터 미입력",
  actualNeed:  "실적 데이터 연결 필요",
  forecastNA:  "예측 불가",
};

/* 표 컬럼 정의 — empty_data_template CSV 헤더와 문자 단위 1:1 일치
   (req: 필수 ●, auto: 자동계산 컬럼 표기) */
const SALES_MONTHLY_COLS = [
  {k:"기준연월",req:1},{k:"본부명",req:1},{k:"매출액_당월",req:1},
  {k:"매출액_전년동월"},{k:"증감액_전년대비",auto:1},{k:"증감률_전년대비",auto:1},
  {k:"매출액_누적",auto:1},{k:"데이터출처ID",req:1},{k:"갱신일",req:1},
];
const SALES_DETAIL_COLS = [
  {k:"매출일자",req:1},{k:"거래처코드",req:1},{k:"거래처명",req:1},{k:"팀코드",req:1},
  {k:"채널구분",req:1},{k:"카테고리"},{k:"수량"},{k:"단위"},{k:"매출액",req:1},
  {k:"세금계산서번호"},{k:"데이터출처ID",req:1},{k:"갱신일",req:1},
];
const RECEIVABLES_COLS = [
  {k:"기준일",req:1},{k:"거래처코드",req:1},{k:"거래처명",req:1},{k:"세금계산서번호"},
  {k:"채권발생일",req:1},{k:"결제예정일"},{k:"채권금액",req:1},{k:"연체일수",auto:1},
  {k:"연령구간",auto:1},{k:"회수상태"},{k:"데이터출처ID",req:1},{k:"갱신일",req:1},
];
const MARKET_COLS = [
  {k:"기준연월",req:1},{k:"순위",req:1},{k:"업체명",req:1},{k:"자사여부",req:1},
  {k:"수입액"},{k:"시장점유율"},{k:"전년대비증감률"},{k:"주요브랜드"},{k:"동향코멘트"},
  {k:"출처기관",req:1},{k:"출처URL_또는_문서",req:1},{k:"데이터출처ID",req:1},{k:"갱신일",req:1},
];
const TARGET_COLS = [

      const prev=B_MONTHLY[i-1], d=tot-prev, p=d/prev*100, col=d>=0?"#5fd6a3":"#f08a8a";

/* ===== 접근 잠금 (간단 비밀번호) — 클라이언트 측 SHA-256 게이트 =====
   ⚠ 화면 차단용. HTML 소스로 데이터 열람은 가능(완전 보안 아님). 강한 보안은 콘텐츠 암호화/호스팅 비번 권장. */
(function(){
  var HASH = "0fde51116efab90707b7f2952cb1d08112ad3bc4d45ee7afeb58a3d1b5739346"; // 접근 비밀번호의 SHA-256
  // 순수 JS SHA-256 (의존성 없음 · 공개도메인 geraintluff)
  function sha256(ascii){
    function rr(v,a){return (v>>>a)|(v<<(32-a));}
    var mp=Math.pow, mw=mp(2,32), L='length', i,j, result='', words=[], bitLen=ascii[L]*8;
    var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[], pc=k[L], comp={};
    for(var c=2; pc<64; c++){ if(!comp[c]){ for(i=0;i<313;i+=c){comp[i]=c;}
      hash[pc]=(mp(c,.5)*mw)|0; k[pc++]=(mp(c,1/3)*mw)|0; } }
    ascii+='\x80'; while(ascii[L]%64-56) ascii+='\x00';
    for(i=0;i<ascii[L];i++){ j=ascii.charCodeAt(i); if(j>>8) return; words[i>>2]|=j<<((3-i)%4)*8; }
    words[words[L]]=((bitLen/mw)|0); words[words[L]]=(bitLen);
    for(j=0;j<words[L];){ var w=words.slice(j,j+=16), oh=hash; hash=hash.slice(0,8);
      for(i=0;i<64;i++){ var w15=w[i-15], w2=w[i-2], a=hash[0], e=hash[4];
        var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[i]
          +(w[i]=(i<16)?w[i]:(w[i-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[i-7]
          +(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
        var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
        hash=[(t1+t2)|0].concat(hash); hash[4]=(hash[4]+t1)|0; }
      for(i=0;i<8;i++){ hash[i]=(hash[i]+oh[i])|0; } }
    for(i=0;i<8;i++){ for(j=3;j+1;j--){ var b=(hash[i]>>(j*8))&255; result+=((b<16)?0:'')+b.toString(16); } }
    return result;
  }
  var gate=document.getElementById("gate");
  if(!gate) return;
  function authed(){ try { return sessionStorage.getItem("on_auth")==="1"; } catch(e){ return false; } }
  function remember(){ try { sessionStorage.setItem("on_auth","1"); } catch(e){} }
  function unlock(){ if(gate && gate.parentNode) gate.parentNode.removeChild(gate); }
  if(authed()){ unlock(); return; }
  var pw=document.getElementById("gate-pw"), go=document.getElementById("gate-go"), err=document.getElementById("gate-err");
  function tryOpen(){
    if(sha256(pw.value)===HASH){ remember(); unlock(); }
    else { err.textContent="비밀번호가 올바르지 않습니다."; pw.value=""; pw.focus(); }
  }
  go.addEventListener("click", tryOpen);
  pw.addEventListener("keydown", function(e){ if(e.key==="Enter") tryOpen(); });
  try { pw.focus(); } catch(e){}
})();
</script>
